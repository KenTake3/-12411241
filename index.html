<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>英検5級マスターPRO</title>
  <style>
    :root {
      --primary: #4A90E2;
      --accent: #FF6B6B;
      --success: #2ECC71;
      --warning: #F1C40F;
      --danger: #E74C3C;
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; color: #2C3E50; }

    header { width: 100%; max-width: 420px; text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; color: #2C3E50; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    
    #app { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 20px; min-height: 480px; display: flex; flex-direction: column; position: relative; }

    /* ローディング */
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 350px; text-align: center; gap: 15px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #E1E8ED; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* メニューボタン */
    .menu-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .menu-btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: bold; color: white; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: space-between; }
    .menu-btn:active { transform: scale(0.97); }
    .btn-flashcard { background: linear-gradient(135deg, #4A90E2, #357ABD); }
    .btn-quiz { background: linear-gradient(135deg, #2ECC71, #27AE60); }
    .btn-grammar { background: linear-gradient(135deg, #9B59B6, #8E44AD); }
    .btn-exam { background: linear-gradient(135deg, #FF6B6B, #EE5253); }

    /* フィルター切替 */
    .filter-bar { display: flex; background: #E1E8ED; padding: 4px; border-radius: 12px; margin-bottom: 15px; }
    .filter-opt { flex: 1; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; cursor: pointer; color: #7F8C8D; }
    .filter-opt.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

    /* フラッシュカード */
    .flashcard-box { width: 100%; height: 220px; background: #FAFAFA; border: 3px solid #E1E8ED; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; position: relative; cursor: pointer; margin-bottom: 15px; }
    .category-badge { position: absolute; top: 12px; left: 12px; background: var(--primary); color: white; font-size: 0.75rem; padding: 3px 10px; border-radius: 10px; font-weight: bold; }
    .master-btn { position: absolute; top: 10px; right: 10px; border: none; background: #E1E8ED; color: #7F8C8D; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .master-btn.done { background: #E8F8F5; color: var(--success); border: 1px solid var(--success); }
    .fc-en { font-size: 1.8rem; font-weight: bold; margin-bottom: 8px; text-align: center; word-break: break-word; }
    .fc-jp { font-size: 1.2rem; color: var(--accent); font-weight: bold; min-height: 1.5rem; }

    /* アクションボタン */
    .ctrl-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .act-btn { flex: 1; padding: 12px; font-size: 1rem; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .act-sound { background: var(--warning); color: #2C3E50; }
    .act-nav { background: var(--primary); color: white; }
    .act-sub { background: #CBD5E0; color: #2C3E50; }

    /* クイズ共通 */
    .quiz-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold; color: #7F8C8D; margin-bottom: 15px; }
    .timer-badge { background: #FFEAA7; color: #D35400; padding: 4px 10px; border-radius: 10px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .q-box { text-align: center; margin-bottom: 20px; min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .q-text { font-size: 1.6rem; font-weight: bold; color: #2C3E50; word-break: break-word; }

    .choices-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .choice-btn { padding: 14px 15px; font-size: 1rem; border: 2px solid #E1E8ED; background: white; border-radius: 12px; font-weight: bold; text-align: left; cursor: pointer; color: #2C3E50; transition: all 0.1s; }
    .choice-btn:active { transform: scale(0.98); }
    .choice-btn.correct { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
    .choice-btn.wrong { background: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }

    /* 並び替え */
    .slot-box { min-height: 60px; border: 2px dashed #CBD5E0; border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; background: #FAFAFA; margin-bottom: 15px; }
    .word-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .w-btn { padding: 8px 14px; font-size: 1rem; border: none; background: var(--primary); color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .w-btn.used { background: #E1E8ED; color: #A0AEC0; cursor: not-allowed; }

    /* 共通フッター・ナビ */
    .home-btn { border: none; background: none; font-size: 0.9rem; font-weight: bold; color: #7F8C8D; cursor: pointer; margin-top: auto; padding-top: 15px; text-align: center; width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px; }
    
    /* 結果表示 */
    .result-box { text-align: center; padding: 20px 0; }
    .result-badge { font-size: 3rem; margin-bottom: 10px; }
    .result-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
    .result-score { font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 15px 0; }
  </style>
</head>
<body>

  <header>
    <h1>🏆 英検5級マスター PRO</h1>
  </header>

  <div id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p style="font-weight:bold; color:#7F8C8D;">スプレッドシートからデータ読み込み中...</p>
    </div>
  </div>

  <script>
    // 🔗 あなたのGoogle Apps Script API URL
    const API_URL = "https://script.google.com/a/macros/walkme.com/s/AKfycbwN9flRoBD8iFbbySWK0Lbe9QlVFQI61nNLYZUKGELqbVouxEJph-KLtXE6A2vaTvbe/exec";

    // --- 音声エンジンの準備 ---
    let voices = [];
    window.speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); };
    function speakText(text) {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'en-US';
      uttr.rate = 0.85;
      if (voices.length === 0) voices = window.speechSynthesis.getVoices();
      const englishVoice = voices.find(v => v.lang.indexOf('en-') !== -1) || voices.find(v => v.lang === 'en');
      if (englishVoice) uttr.voice = englishVoice;
      window.speechSynthesis.speak(uttr);
    }

    // --- ローカルストレージ（できた！管理） ---
    function getMasteredList() {
      return JSON.parse(localStorage.getItem('eiken5_mastered') || '[]');
    }
    function toggleMastered(word) {
      let list = getMasteredList();
      if (list.includes(word)) {
        list = list.filter(w => w !== word);
      } else {
        list.push(word);
      }
      localStorage.setItem('eiken5_mastered', JSON.stringify(list));
    }

    // --- アプリの状態管理 ---
    let db = { tango: [], grammar: [] };
    let currentList = [];
    let currentIndex = 0;
    let currentFilter = 'all'; // 'all' or 'unmastered'
    let score = 0;
    let timerInterval = null;
    let timeLeft = 300; // 模試タイマー（5分）
    let grammarSelected = [];

    const appDiv = document.getElementById('app');

    // --- データ読み込み ---
    async function loadData() {
      try {
        const res = await fetch(API_URL);
        db = await res.json();
        renderMenu();
      } catch (err) {
        appDiv.innerHTML = `
          <div class="loading-screen">
            <p style="color:var(--danger); font-weight:bold;">データの読み込みに失敗しました。</p>
            <p style="font-size:0.85rem; color:#7F8C8D;">インターネット接続またはGoogleの設定を確認してください。</p>
            <button class="act-btn act-nav" onclick="loadData()">再試行する</button>
          </div>
        `;
      }
    }

    // --- 1. メニュー画面 ---
    function renderMenu() {
      clearInterval(timerInterval);
      const masteredCount = getMasteredList().length;
      const totalTango = db.tango.length;

      appDiv.innerHTML = `
        <div style="text-align:center; margin-bottom:15px;">
          <div style="font-size:0.85rem; color:#7F8C8D; font-weight:bold;">マスター状況: ${masteredCount} / ${totalTango} 語クリア！</div>
        </div>
        
        <div class="menu-grid">
          <button class="menu-btn btn-flashcard" onclick="startFlashcard()">
            <span>🎴 単語カード（覚える）</span><span>➔</span>
          </button>
          <button class="menu-btn btn-quiz" onclick="startQuiz('vocab')">
            <span>🎯 単語クイズ（4択）</span><span>➔</span>
          </button>
          <button class="menu-btn btn-grammar" onclick="startGrammar()">
            <span>🧩 文法ならびかえ</span><span>➔</span>
          </button>
          <button class="menu-btn btn-exam" onclick="startMockExam()">
            <span>⏱️ 英検5級 模擬テスト</span><span>➔</span>
          </button>
        </div>
      `;
    }

    // --- 2. フラッシュカードモード ---
    function startFlashcard() {
      applyFilter();
      currentIndex = 0;
      renderFlashcard();
    }

    function applyFilter() {
      const mastered = getMasteredList();
      if (currentFilter === 'unmastered') {
        currentList = db.tango.filter(item => !mastered.includes(item.q));
      } else {
        currentList = [...db.tango];
      }
    }

    function renderFlashcard() {
      if (currentList.length === 0) {
        appDiv.innerHTML = `
          <div class="result-box">
            <div class="result-badge">🎉</div>
            <div class="result-title">すごい！ぜんぶクリア！</div>
            <p style="color:#7F8C8D; margin-bottom:20px;">「苦手・未マスター」の単語はありません！</p>
            <button class="act-btn act-nav" onclick="currentFilter='all'; startFlashcard();">すべての単語を見る</button>
          </div>
          <button class="home-btn" onclick="renderMenu()">🏠 メニューへもどる</button>
        `;
        return;
      }

      const item = currentList[currentIndex];
      const isMastered = getMasteredList().includes(item.q);

      appDiv.innerHTML = `
        <div class="filter-bar">
          <div class="filter-opt ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">すべて (${db.tango.length})</div>
          <div class="filter-opt ${currentFilter==='unmastered'?'active':''}" onclick="setFilter('unmastered')">苦手・未マスター</div>
        </div>

        <div class="flashcard-box" onclick="toggleJpDisplay()">
          <span class="category-badge">${item.category}</span>
          <button class="master-btn ${isMastered?'done':''}" onclick="event.stopPropagation(); toggleMasterState('${item.q.replace(/'/g, "\\'")}')">
            ${isMastered ? '✓ できた！' : '○ 覚えた？'}
          </button>
          <div class="fc-en">${item.q}</div>
          <div class="fc-jp" id="fc-jp-text" style="display:none;">${item.options[0]}</div>
          <p style="font-size:0.75rem; color:#A0AEC0; position:absolute; bottom:10px;">💡 タップで日本語を表示</p>
        </div>

        <div class="ctrl-row">
          <button class="act-btn act-sound" onclick="speakText('${item.q.replace(/'/g, "\\'")}')">🔊 おとをきく</button>
        </div>
        <div class="ctrl-row">
          <button class="act-btn act-nav" onclick="prevCard()">まえへ</button>
          <button class="act-btn act-nav" onclick="nextCard()">つぎへ</button>
        </div>
        <div class="ctrl-row">
          <button class="act-btn act-sub" onclick="shuffleCards()">🔀 シャッフル</button>
        </div>
        
        <div style="text-align:center; font-size:0.85rem; color:#7F8C8D; margin-top:8px;">${currentIndex + 1} / ${currentList.length}</div>
        <button class="home-btn" onclick="renderMenu()">🏠 メニューへもどる</button>
      `;
      speakText(item.q);
    }

    function toggleJpDisplay() {
      const el = document.getElementById('fc-jp-text');
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function toggleMasterState(word) {
      toggleMastered(word);
      renderFlashcard();
    }

    function setFilter(type) {
      currentFilter = type;
      startFlashcard();
    }

    function nextCard() {
      if (currentIndex < currentList.length - 1) { currentIndex++; renderFlashcard(); }
    }
    function prevCard() {
      if (currentIndex > 0) { currentIndex--; renderFlashcard(); }
    }
    function shuffleCards() {
      currentList.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderFlashcard();
    }

    // --- 3. クイズモード (単語4択) ---
    function startQuiz(type) {
      currentList = [...db.tango].sort(() => Math.random() - 0.5).slice(0, 10);
      currentIndex = 0;
      score = 0;
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      if (currentIndex >= currentList.length) {
        renderQuizResult();
        return;
      }

      const item = currentList[currentIndex];
      // 選択肢のシャッフル
      const choices = item.options.map((opt, i) => ({ text: opt, isCorrect: i === 0 }))
                                  .sort(() => Math.random() - 0.5);

      appDiv.innerHTML = `
        <div class="quiz-header">
          <span>問題 ${currentIndex + 1} / ${currentList.length}</span>
          <span>スコア: ${score}</span>
        </div>

        <div class="q-box">
          <div class="q-text">${item.q}</div>
          <button class="act-btn act-sound" onclick="speakText('${item.q.replace(/'/g, "\\'")}')" style="margin-top:10px; padding:6px 15px; font-size:0.9rem;">🔊 音声</button>
        </div>

        <div class="choices-grid">
          ${choices.map((c, i) => `
            <button class="choice-btn" onclick="checkChoice(${c.isCorrect}, this)">${i+1}. ${c.text}</button>
          `).join('')}
        </div>
        <button class="home-btn" onclick="renderMenu()">🏠 メニューへもどる</button>
      `;
      speakText(item.q);
    }

    function checkChoice(isCorrect, btn) {
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      if (isCorrect) {
        btn.classList.add('correct');
        score += 10;
      } else {
        btn.classList.add('wrong');
      }
      setTimeout(() => {
        currentIndex++;
        renderQuizQuestion();
      }, 1200);
    }

    function renderQuizResult() {
      appDiv.innerHTML = `
        <div class="result-box">
          <div class="result-badge">${score >= 80 ? '🎉' : '👍'}</div>
          <div class="result-title">クイズ終了！</div>
          <div class="result-score">${score} 点</div>
          <p style="color:#7F8C8D; margin-bottom:20px;">${score >= 80 ? '素晴らしい成績です！' : 'もう一度挑戦しよう！'}</p>
          <button class="act-btn act-nav" onclick="startQuiz('vocab')">もう一度挑戦</button>
        </div>
        <button class="home-btn" onclick="renderMenu()">🏠 メニューへもどる</button>
      `;
    }

    // --- 4. 文法並び替えモード ---
    function startGrammar() {
      currentList = [...db.grammar].sort(() => Math.random() - 0.5).slice(0, 5);
      currentIndex = 0;
      score = 0;
      renderGrammarQuestion();
    }

    function renderGrammarQuestion() {
      if (currentIndex >= currentList.length) {
        renderGrammarResult();
        return;
      }

      grammarSelected = [];
      const item = currentList[currentIndex];
      const shuffledWords = [...item.words].sort(() => Math.random() - 0.5);

      appDiv.innerHTML = `
        <div class="quiz-header">
          <span>問題 ${currentIndex + 1} / ${currentList.length}</span>
          <span>スコア: ${score}</span>
        </div>

        <div class="q-box">
          <div style="font-size:1.1rem; font-weight:bold; color:#2C3E50;">${item.jp}</div>
        </div>

        <div class="slot-box" id="grammar-slot"></div>

        <div class="word-bank">
          ${shuffledWords.map((w, i) => `
            <button class="w-btn" id="wb-${i}" onclick="pickGrammarWord('${w.replace(/'/g, "\\'")}', ${i})">${w}</button>
          `).join('')}
        </div>

        <div class="ctrl-row" style="margin-top:20px;">
          <button class="act-btn act-sub" onclick="resetGrammarSlot()">やり直す</button>
          <button class="act-btn act-nav" onclick="checkGrammarAnswer()">判定する</button>
        </div>
        <button class="home-btn" onclick="renderMenu()">🏠 メニューへもどる</button>
      `;
    }

    function pickGrammarWord(word, idx) {
      const btn = document.getElementById(`wb-${idx}`);
      if (btn.classList.contains('used')) return;
      btn.classList.add('used');
      grammarSelected.push(word);
      document.getElementById('grammar-slot').innerHTML = grammarSelected.map(w => `<span style="font-weight:bold; color:var(--primary); font-size:1.1rem;">${w}</span>`).join(' ');
    }

    function resetGrammarSlot() {
      grammarSelected = [];
      document.querySelectorAll('.w-btn').forEach(b => b.classList.remove('used'));
      document.getElementById('grammar-slot').innerHTML = '';
    }

    function checkGrammarAnswer() {
      const item = currentList[currentIndex];
      if (grammarSelected.length !== item.words.length) {
        alert("すべての単語をならべてね！");
        return;
      }

      const isCorrect = grammarSelected.join(' ') === item.a.join(' ');
      const slot = document.getElementById('grammar-slot');

      if (isCorrect) {
        slot.style.borderColor = "var(--success)";
        slot.style.background = "#E8F8F5";
        score += 20;
        speakText(item.a.join(' '));
      } else {
        slot.style.borderColor = "var(--danger)";
        slot.style.background = "#FDEDEC";
        slot.innerHTML = `<span style="color:var(--danger); font-size:0.9rem; font-weight:bold;">正解: ${item.a.join(' ')}</span>`;
      }

      setTimeout(() => {
        currentIndex++;
        renderGrammarQuestion();
      }, 2000);
    }

    function renderGrammarResult() {
      appDiv.innerHTML = `
        <div class="result-box">
          <div class="result-badge">${score >= 80 ? '🎖️' : '📚'}</div>
          <div class="result-title">文法特訓 完了！</div>
          <div class="result-score">${score} 点</div>
          <button class="act-btn act-nav" onclick="startGrammar()">もう一度挑戦</button>
        </div>
        <button class="home-btn" onclick="renderMenu()">🏠 メニューへもどる</button>
      `;
    }

    // --- 5. 英検5級 模擬テストモード ---
    function startMockExam() {
      // 単語8問 ＋ 文法2問 の合計10問構成
      const tangoQuestions = [...db.tango].sort(() => Math.random() - 0.5).slice(0, 8);
      const grammarQuestions = [...db.grammar].sort(() => Math.random() - 0.5).slice(0, 2);
      
      currentList = [...tangoQuestions, ...grammarQuestions].sort(() => Math.random() - 0.5);
      currentIndex = 0;
      score = 0;
      timeLeft = 300; // 5分

      timerInterval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById('exam-timer');
        if (timerEl) {
          const m = Math.floor(timeLeft / 60);
          const s = timeLeft % 60;
          timerEl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("タイムアップ！");
          renderMockResult();
        }
      }, 1000);

      renderMockQuestion();
    }

    function renderMockQuestion() {
      if (currentIndex >= currentList.length) {
        clearInterval(timerInterval);
        renderMockResult();
        return;
      }

      const item = currentList[currentIndex];
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      const timerStr = `${m}:${s < 10 ? '0' : ''}${s}`;

      // 並び替え問題の場合
      if (item.words) {
        grammarSelected = [];
        const shuffledWords = [...item.words].sort(() => Math.random() - 0.5);

        appDiv.innerHTML = `
          <div class="quiz-header">
            <span>模試 第${currentIndex + 1}問 / 10</span>
            <span class="timer-badge">⏳ <span id="exam-timer">${timerStr}</span></span>
          </div>

          <div class="q-box">
            <div style="font-size:1.1rem; font-weight:bold; color:#2C3E50;">${item.jp}</div>
          </div>

          <div class="slot-box" id="grammar-slot"></div>

          <div class="word-bank">
            ${shuffledWords.map((w, i) => `
              <button class="w-btn" id="wb-${i}" onclick="pickGrammarWord('${w.replace(/'/g, "\\'")}', ${i})">${w}</button>
            `).join('')}
          </div>

          <div class="ctrl-row" style="margin-top:20px;">
            <button class="act-btn act-sub" onclick="resetGrammarSlot()">やり直す</button>
            <button class="act-btn act-nav" onclick="checkGrammarAnswer()">回答する</button>
          </div>
        `;
      } 
      // 単語クイズの場合
      else {
        const choices = item.options.map((opt, i) => ({ text: opt, isCorrect: i === 0 }))
                                    .sort(() => Math.random() - 0.5);

        appDiv.innerHTML = `
          <div class="quiz-header">
            <span>模試 第${currentIndex + 1}問 / 10</span>
            <span class="timer-badge">⏳ <span id="exam-timer">${timerStr}</span></span>
          </div>

          <div class="q-box">
            <div class="q-text">${item.q}</div>
            <button class="act-btn act-sound" onclick="speakText('${item.q.replace(/'/g, "\\'")}')" style="margin-top:8px; padding:4px 12px; font-size:0.85rem;">🔊 音声</button>
          </div>

          <div class="choices-grid">
            ${choices.map((c, i) => `
              <button class="choice-btn" onclick="checkChoice(${c.isCorrect}, this)">${i+1}. ${c.text}</button>
            `).join('')}
          </div>
        `;
        speakText(item.q);
      }
    }

    function renderMockResult() {
      const isPassed = score >= 70; // 70%以上で合格
      appDiv.innerHTML = `
        <div class="result-box">
          <div class="result-badge">${isPassed ? '🎉' : '📄'}</div>
          <div class="result-title" style="color: ${isPassed ? 'var(--success)' : 'var(--danger)'};">
            ${isPassed ? '英検5級 判定：合格！' : '英検5級 判定：不合格'}
          </div>
          <div class="result-score">${score} 点 / 100点</div>
          <p style="color:#7F8C8D; margin-bottom:20px;">
            ${isPassed ? 'この調子！本番もバッチリです！' : '単語と文法をもう一度復習してみよう！'}
          </p>
          <button class="act-btn act-nav" onclick="startMockExam()">もう一度模試を受ける</button>
        </div>
        <button class="home-btn" onclick="renderMenu()">🏠 メニューへもどる</button>
      `;
    }

    // 起動時の自動データロード
    loadData();
  </script>
</body>
</html>
